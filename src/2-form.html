<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>feedback form</title>
  </head>
  <body>
    <form class="feedback-form" autocomplete="off">
      <label>
        email
        <input class="feedback-input" id="email" type="email" name="email" autofocus />
      </label>
      <label>
        message
        <textarea class="feedback-textarea" id="message" name="message" rows="8"></textarea>
      </label>
      <button class="feedback-button" type="submit">Submit</button>
    </form>

    <script type="module" src="./js/2-form.js"></script>
  </body>
</html>
